<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अल्ट्रा जेस्चर YouTube कंट्रोल</title>
    <style>
        /* सामान्य बॉडी स्टाइल */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            overflow-x: hidden; /* हॉरिजॉन्टल स्क्रॉलिंग रोकें */
        }
        
        /* कंटेनर और हेडर */
        .container {
            width: 90%;
            max-width: 1200px;
            text-align: center;
        }
        h1 { color: #cc0000; margin-bottom: 5px; }
        #info { font-size: 1.1em; color: #555; margin-bottom: 20px; }

        /* YouTube प्लेयर कंटेनर */
        #player-container {
            width: 100%;
            aspect-ratio: 16 / 9; /* 16:9 आस्पेक्ट रेश्यो बनाए रखें */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
            background-color: black;
        }
        
        /* वीडियो फीड (छिपा हुआ) */
        .input_video { display: none; }
        
        /* कस्टम कर्सर */
        #cursor {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: rgba(255, 0, 0, 0.7); /* लाल */
            border: 3px solid white;
            border-radius: 50%;
            pointer-events: none; /* यह महत्वपूर्ण है ताकि यह क्लिक में बाधा न डाले */
            transform: translate(-50%, -50%);
            display: none;
            transition: background-color 0.1s, transform 0.1s;
            z-index: 9999;
            font-size: 10px;
            line-height: 25px;
            color: white;
            font-weight: bold;
        }
        /* जब क्लिक या कोई एक्शन ट्रिगर हो */
        #cursor.action {
            background-color: rgba(0, 200, 0, 0.9); /* हरा */
            transform: translate(-50%, -50%) scale(1.3);
        }

        /* स्टेटस बार */
        #status {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            min-height: 20px;
        }
    </style>
    
    <!-- MediaPipe लाइब्रेरी इम्पोर्ट करें -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- YouTube iFrame Player API को लोड करने के लिए स्क्रिप्ट -->
    <script>
      var tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    </script>
</head>
<body>

    <!-- कैमरा फ़ीड के लिए वीडियो एलिमेंट -->
    <video class="input_video"></video>

    <div class="container">
        <h1>YouTube जेस्चर कंट्रोल सिस्टम</h1>
        <p id="info">कैमरा शुरू करें और दिए गए इशारों का उपयोग करें।</p>
        
        <div id="player-container">
            <!-- यहाँ YouTube प्लेयर लोड होगा -->
            <div id="youtube-player"></div>
        </div>

        <div id="status">स्थिति: **कैमरे का इंतज़ार**</div>
    </div>

    <!-- कस्टम कर्सर -->
    <div id="cursor"></div>

    <script>
        // ======================================================================
        // I. ग्लोबल वैरिएबल और कॉन्स्टेंट (Global Variables and Constants)
        // ======================================================================

        const videoElement = document.querySelector('.input_video');
        const cursor = document.getElementById('cursor');
        const statusElement = document.getElementById('status');
        const videoId = 'dQw4w9WgXcQ'; // Rick Astley - Never Gonna Give You Up (टेस्ट के लिए)
        
        // जेस्चर ट्रैकिंग के लिए स्टेट वैरिएबल
        let player; // YouTube प्लेयर ऑब्जेक्ट
        let lastActionTime = 0;
        const ACTION_DEBOUNCE_MS = 800; // मिलीसेकंड में कूलडाउन टाइम
        let lastIndexX = 0;
        let lastIndexY = 0;
        let isHandPresent = false;
        
        // स्क्रॉलिंग के लिए वैरिएबल
        let lastScrollY = 0;
        const SCROLL_THRESHOLD = 0.05; // हथेली की Y-स्थिति में बदलाव का थ्रेशोल्ड
        const SWIPE_VELOCITY_THRESHOLD = 0.03; // स्वाइप की गति का थ्रेशोल्ड

        // ======================================================================
        // II. YOUTUBE PLAYER API फंक्शन
        // ======================================================================

        // 1. YouTube API के लोड होने पर यह फंक्शन कॉल होता है
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'playsinline': 1,
                    'controls': 0, // हम अपने जेस्चर से कंट्रोल करेंगे
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // 2. जब प्लेयर लोड होने के लिए तैयार हो
        function onPlayerReady(event) {
            statusElement.innerHTML = 'स्थिति: **YouTube प्लेयर तैयार। कैमरे की अनुमति दें।**';
            event.target.setVolume(50); // वॉल्यूम 50 पर सेट करें
        }

        // 3. जब प्लेयर की स्थिति बदलती है (प्ले, पॉज, एंड)
        function onPlayerStateChange(event) {
            const state = event.data;
            let statusText = '';
            if (state === YT.PlayerState.PLAYING) statusText = 'प्लेइंग';
            else if (state === YT.PlayerState.PAUSED) statusText = 'रुका हुआ';
            else if (state === YT.PlayerState.ENDED) statusText = 'समाप्त';
            
            statusElement.innerHTML = `स्थिति: **${statusText}** | वॉल्यूम: ${player.getVolume()}%`;
        }

        // 4. प्ले/पॉज टॉगल
        function ytPlayPause() {
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                updateStatus('पॉज किया गया');
            } else {
                player.playVideo();
                updateStatus('प्ले किया गया');
            }
        }

        // 5. वीडियो में आगे/पीछे कूदना
        function ytSeek(seconds) {
            const newTime = player.getCurrentTime() + seconds;
            player.seekTo(newTime, true);
            updateStatus(`आगे/पीछे ${seconds > 0 ? '+' : ''}${seconds} सेकंड`);
        }

        // 6. वॉल्यूम बदलना
        function ytChangeVolume(delta) {
            let currentVolume = player.getVolume();
            let newVolume = Math.max(0, Math.min(100, currentVolume + delta));
            player.setVolume(newVolume);
            updateStatus(`वॉल्यूम बदला: ${newVolume}%`);
        }
        
        // 7. फुलस्क्रीन टॉगल
        function ytToggleFullscreen() {
            const iframe = document.getElementById('youtube-player');
            if (iframe) {
                if (document.fullscreenElement) {
                    document.exitFullscreen();
                    updateStatus('फुलस्क्रीन बंद');
                } else {
                    iframe.requestFullscreen();
                    updateStatus('फुलस्क्रीन ऑन');
                }
            }
        }

        // 8. अगले/पिछले वीडियो पर जाना (एक नकली API कॉल)
        function ytNextVideo() {
            // वास्तविक यूट्यूब में यह प्लेलिस्ट या सुझाए गए वीडियो पर क्लिक करेगा
            // यहाँ हम सिर्फ एक सूचना दिखाते हैं
            updateStatus('अगला वीडियो लोड किया जा रहा है...');
            // अगर आप इसे किसी वेबपेज पर चला रहे हैं, तो आप यहाँ "Next Button" पर क्लिक करने के लिए pyautogui का इस्तेमाल करेंगे
        }

        // 9. स्टेटस अपडेट करने का फंक्शन
        function updateStatus(message, isAction = true) {
            statusElement.innerHTML = `स्थिति: **${message}** | वॉल्यूम: ${player.getVolume()}%`;
            if (isAction) {
                cursor.classList.add('action');
                setTimeout(() => cursor.classList.remove('action'), 200);
            }
        }


        // ======================================================================
        // III. MEDIAPIPE जेस्चर डिटेक्शन लॉजिक
        // ======================================================================

        function onResults(results) {
            const now = Date.now();
            cursor.style.display = 'none';
            
            // अगर हाथ मौजूद है
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // उंगली की नोक (Landmark #8)
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const wrist = landmarks[0];
                
                // कर्सर कोऑर्डिनेट्स को स्क्रीन में मैप करें
                const x = window.innerWidth * (1 - indexTip.x);
                const y = window.innerHeight * indexTip.y;
                
                cursor.style.display = 'block';
                cursor.style.left = `${x}px`;
                cursor.style.top = `${y}px`;
                
                isHandPresent = true;
                
                // अगर कूलडाउन पीरियड में है, तो कोई कार्रवाई न करें
                if (now - lastActionTime < ACTION_DEBOUNCE_MS) {
                    lastIndexX = indexTip.x;
                    lastIndexY = indexTip.y;
                    return;
                }

                // ===================================================
                // JESTURE LOGIC: प्ले/पॉज (खुली हथेली)
                // ===================================================
                
                // अंगूठे और तर्जनी के बीच की दूरी (pinch distance)
                const pinchDistance = Math.sqrt(
                    Math.pow(indexTip.x - thumbTip.x, 2) +
                    Math.pow(indexTip.y - thumbTip.y, 2)
                );
                
                // अगर पिंच दूरी एक थ्रेशोल्ड के नीचे है (यानी हाथ बंद है) - हम इसका उपयोग प्ले/पॉज के लिए नहीं, बल्कि क्लिक के लिए करते हैं
                const PINCH_THRESHOLD = 0.05;
                
                if (pinchDistance < PINCH_THRESHOLD) {
                    // अगर चुटकी बनी हुई है
                    // हम इसे प्ले/पॉज के बजाय एक सामान्य "एंटर" कमांड मानते हैं
                    // (हम प्ले/पॉज के लिए "खुली हथेली" जेस्चर का उपयोग करेंगे)
                    
                } else if (pinchDistance > 0.15 && (now - lastActionTime > 2000)) { 
                    // अगर हाथ खुला है और 2 सेकंड से ज्यादा हो गया है (यानी गलती से ट्रिगर नहीं हुआ)
                    // हम इसे प्ले/पॉज मानते हैं
                    ytPlayPause();
                    lastActionTime = now;
                    return; 
                }

                // ===================================================
                // JESTURE LOGIC: SEEK/SWIPE (तर्जनी का तेज हिलाना)
                // ===================================================

                const deltaX = indexTip.x - lastIndexX;
                const timeDelta = now - lastActionTime; 

                // स्वाइप जेस्चर के लिए: तेज गति
                if (timeDelta > 50 && timeDelta < 400) {
                    if (deltaX > SWIPE_VELOCITY_THRESHOLD) { // बाएँ से दाएँ (पीछे की ओर)
                        ytSeek(-10);
                        lastActionTime = now;
                    } else if (deltaX < -SWIPE_VELOCITY_THRESHOLD) { // दाएँ से बाएँ (आगे की ओर)
                        ytSeek(10);
                        lastActionTime = now;
                    }
                }

                // ===================================================
                // JESTURE LOGIC: वॉल्यूम (हाथ का ऊपर/नीचे होना)
                // ===================================================
                
                const deltaY = indexTip.y - lastIndexY;

                if (Math.abs(deltaY) > 0.05 && pinchDistance > 0.1) { // अगर हाथ खुला है और y में बड़ा बदलाव है
                    if (deltaY < -0.05) { // ऊपर की ओर
                        ytChangeVolume(5);
                        lastActionTime = now;
                    } else if (deltaY > 0.05) { // नीचे की ओर
                        ytChangeVolume(-5);
                        lastActionTime = now;
                    }
                }

                // ===================================================
                // JESTURE LOGIC: पेज स्क्रॉलिंग (पूरे हाथ को नीचे लाना)
                // ===================================================

                // wrist y-कोऑर्डिनेट का उपयोग करके स्क्रॉल करें (सिर्फ तब जब कोई मेजर एक्शन न हो)
                const wristY = wrist.y;
                const scrollDelta = wristY - lastScrollY;
                
                if (Math.abs(scrollDelta) > SCROLL_THRESHOLD && now - lastActionTime > 500) {
                    const scrollAmount = Math.sign(scrollDelta) * 50; // 50 पिक्सेल स्क्रॉल करें
                    window.scrollBy(0, scrollAmount);
                    // updateStatus(`स्क्रॉलिंग ${scrollAmount > 0 ? 'नीचे' : 'ऊपर'}`); // इसे बार-बार दिखाने से बचने के लिए कमेंट किया गया
                }
                lastScrollY = wristY;

                // अंत में वर्तमान स्थिति को पिछले स्थिति के रूप में सहेजें
                lastIndexX = indexTip.x;
                lastIndexY = indexTip.y;

            } else {
                isHandPresent = false;
                lastScrollY = 0; // हाथ गायब होने पर स्क्रॉल पोजीशन रीसेट करें
            }
        }


        // ======================================================================
        // IV. MEDIAPIPE और कैमरा सेटअप
        // ======================================================================

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.8,
            minTrackingConfidence: 0.8
        });

        hands.onResults(onResults);

        // कैमरे को शुरू करें
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        camera.start();
        
        // शुरू में स्थिति अपडेट करें
        if (!player) {
             statusElement.innerHTML = 'स्थिति: **YouTube API लोड हो रहा है...**';
        }
        
    </script>

</body>
</html>
