<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Materia Medica Learning Hub</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- Color Palette & Variables --- */
        :root {
            --bg-dark: #0F0F0F;
            --primary-gold: #FFD700;
            --soft-gold: #F5C518;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 215, 0, 0.3);
            --shadow-gold: 0px 10px 30px rgba(255, 215, 0, 0.15);
            --text-light: #FFFFFF;
            --text-gray: #B0B0B0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-dark);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.1);
        }

        /* --- 1️⃣ Top Header Patti --- */
        .header {
            margin: 20px 20px 10px 20px;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,255,255,0.02));
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-gold);
            z-index: 10;
        }

        .header-text h1 {
            color: var(--primary-gold);
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-text p {
            color: var(--text-gray);
            font-size: 11px;
            margin-top: 2px;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, var(--soft-gold), #8B6914);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #000;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            animation: pulse 2s infinite;
        }

        /* --- Scrollable Content --- */
        .content {
            flex: 1;
            padding: 10px 20px 100px 20px; /* Bottom padding for nav bar */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* Hide Scrollbar */
        .content::-webkit-scrollbar { display: none; }
        .content { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- 2️⃣ Main Feature Cards (16:9 3D Glass) --- */
        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: float 6s ease-in-out infinite;
        }

        /* Animation Delays for cards */
        .card:nth-child(1) { animation-delay: 0s; }
        .card:nth-child(2) { animation-delay: 1s; }
        .card:nth-child(3) { animation-delay: 2s; }

        /* Hover & Tap Effects */
        .card:hover, .card:active {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--primary-gold);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.25);
        }

        /* Light Sweep Animation */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,215,0,0.2), rgba(255,255,255,0));
            transform: skewX(-25deg);
            animation: sweep 4s infinite;
        }

        .card-icon {
            font-size: 32px;
            color: var(--primary-gold);
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px rgba(255,215,0,0.4));
            transition: transform 0.3s;
        }

        .card:hover .card-icon { transform: scale(1.1) rotate(5deg); }

        .card h2 {
            color: var(--text-light);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .card p {
            color: var(--text-gray);
            font-size: 13px;
            margin-top: 5px;
        }

        /* Background floating particles for MCQ */
        .particle {
            position: absolute;
            background: var(--primary-gold);
            border-radius: 50%;
            opacity: 0.4;
            animation: floatParticle 3s infinite alternate;
        }

        /* --- 3️⃣ Bottom Navigation Bar --- */
        .bottom-nav {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 70px;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.5);
            padding: 0 10px;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-gray);
            font-size: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            position: relative;
            transition: 0.3s;
            padding: 10px;
        }

        .nav-item span {
            font-size: 10px;
            margin-top: 4px;
            opacity: 0;
            transform: translateY(10px);
            transition: 0.3s;
        }

        .nav-item.active {
            color: var(--primary-gold);
            transform: translateY(-5px);
        }

        .nav-item.active i {
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));
        }

        .nav-item.active span {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Keyframe Animations --- */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes sweep {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-20px) scale(1.5); }
        }

        /* Desktop View adjustments */
        @media (min-width: 480px) {
            .app-container {
                border-radius: 40px;
                border: 8px solid #222;
                height: 90vh;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1️⃣ Top Header Patti -->
        <header class="header">
            <div class="header-text">
                <h1>📚 Materia Medica</h1>
                <p>Learning Hub Premium</p>
            </div>
            <div class="profile-icon">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content">
            
            <!-- 🧠 Card 1: MCQ -->
            <div class="card" onclick="openScreen('MCQ Page')">
                <i class="fa-solid fa-brain card-icon"></i>
                <h2>MCQ Practice</h2>
                <p>Test your Materia Medica knowledge</p>
                <!-- Decorative particles -->
                <div class="particle" style="top: 20%; right: 20%; width: 5px; height: 5px;"></div>
                <div class="particle" style="bottom: 30%; right: 10%; width: 8px; height: 8px; animation-delay: 1s;"></div>
            </div>

            <!-- 📖 Card 2: LAQ -->
            <div class="card" onclick="openScreen('LAQ Page')">
                <i class="fa-solid fa-book-open-reader card-icon"></i>
                <h2>LAQ Practice</h2>
                <p>Long answer questions for deep study</p>
            </div>

            <!-- 📝 Card 3: SAQ -->
            <div class="card" onclick="openScreen('SAQ Page')">
                <i class="fa-solid fa-pen-nib card-icon"></i>
                <h2>SAQ Practice</h2>
                <p>Short answer questions revision</p>
            </div>

        </main>

        <!-- 3️⃣ Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" onclick="setActive(this)">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="#" class="nav-item" onclick="setActive(this)">
                <i class="fa-solid fa-clipboard-question"></i>
                <span>MCQ</span>
            </a>
            <a href="#" class="nav-item" onclick="setActive(this)">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Progress</span>
            </a>
            <a href="#" class="nav-item" onclick="setActive(this)">
                <i class="fa-solid fa-book"></i>
                <span>Notes</span>
            </a>
            <a href="#" class="nav-item" onclick="setActive(this)">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </a>
        </nav>

    </div>

    <!-- Interactive JavaScript -->
    <script>
        // Bottom Navigation Active State Toggle
        function setActive(element) {
            // Remove active class from all items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            // Add active class to clicked item
            element.classList.add('active');
            
            // Trigger haptic feedback (works on mobile devices)
            if (navigator.vibrate) {
                navigator.vibrate(50);
            }
        }

        // Simulate page navigation
        function openScreen(pageName) {
            // Trigger haptic feedback
            if (navigator.vibrate) {
                navigator.vibrate([30, 50, 30]);
            }
            // For now, it just shows an alert. Later it will link to real pages.
            console.log("Navigating to: " + pageName);
            
            // Visual tap effect
            event.currentTarget.style.transform = "scale(0.95)";
            setTimeout(() => {
                event.currentTarget.style.transform = "";
            }, 150);
        }
    </script>
</body>
</html>
